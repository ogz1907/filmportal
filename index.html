
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Film Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b0b0f;color:#fff}
header{background:#111;padding:18px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{color:#e50914;font-size:26px;font-weight:bold}
.hero{padding:70px 20px;text-align:center;background:linear-gradient(135deg,#222,#0b0b0f)}
.hero h1{font-size:42px;margin-bottom:12px}
.hero p{color:#bbb;margin-bottom:25px}
.search{display:flex;max-width:650px;margin:auto}
.search input{flex:1;padding:15px;border:none;border-radius:8px 0 0 8px;font-size:16px}
.search button{padding:15px 22px;border:none;background:#e50914;color:#fff;font-weight:bold;border-radius:0 8px 8px 0;cursor:pointer}
.container{width:92%;max-width:1200px;margin:40px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:#17171d;border-radius:12px;overflow:hidden;border:1px solid #26262f}
.poster{width:100%;height:340px;object-fit:cover;background:#222}
.info{padding:18px}
.info h3{margin-bottom:8px}
.info p{color:#bbb;font-size:14px;line-height:1.5}
.year{color:#ffd54f;margin-top:8px}
.btn{margin-top:15px;width:100%;padding:12px;border:none;background:#e50914;color:#fff;border-radius:8px;cursor:pointer}
#detail{display:none;margin-top:35px;background:#17171d;border-radius:12px;padding:25px;border:1px solid #26262f}
.detail-flex{display:flex;gap:25px;flex-wrap:wrap}
.detail-poster{width:260px;border-radius:10px}
.badge{display:inline-block;background:#2b2b36;padding:6px 10px;border-radius:20px;margin:5px 5px 0 0;font-size:13px}
.close{background:#333;margin-top:20px}
.loading{text-align:center;padding:30px;color:#aaa}
@media(max-width:700px){
.hero h1{font-size:30px}
.search{flex-direction:column}
.search input,.search button{border-radius:8px;margin:5px 0}
.detail-poster{width:100%}
}
</style>
</head>
<body>

<header>
<div class="logo">🎬 Film Portal</div>
<div>Ana Sayfa</div>
</header>

<section class="hero">
<h1>Film Dünyasını Keşfet</h1>
<p>Gerçek film verileriyle ücretsiz arama</p>
<div class="search">
<input id="q" placeholder="Interstellar, Dune, Inception...">
<button onclick="search()">Ara</button>
</div>
</section>

<div class="container">
<h2 style="margin-bottom:20px">Film Sonuçları</h2>
<div id="results" class="grid">
<div class="loading">Bir film arayın</div>
</div>

<div id="detail"></div>
</div>

<script>
const API="https://www.wikidata.org/w/api.php";

function fileUrl(name){
 if(!name) return "https://upload.wikimedia.org/wikipedia/commons/6/65/No-Image-Placeholder.svg";
 return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(name)+"?width=600";
}

async function getEntities(ids){
 const r=await fetch(API+"?action=wbgetentities&ids="+ids.join("|")+"&languages=tr|en&props=labels|descriptions|claims&format=json&origin=*");
 return (await r.json()).entities;
}

function label(e){
 return e?.labels?.tr?.value||e?.labels?.en?.value||"";
}

function ids(claims,p){
 return (claims[p]||[]).map(x=>x?.mainsnak?.datavalue?.value?.id).filter(Boolean);
}

function year(claims){
 const t=claims?.P577?.[0]?.mainsnak?.datavalue?.value?.time;
 return t? t.substring(1,5):"";
}

function poster(claims){
 return claims?.P18?.[0]?.mainsnak?.datavalue?.value||"";
}

async function search(){
 const q=document.getElementById("q").value.trim();
 const results=document.getElementById("results");
 document.getElementById("detail").style.display="none";
 if(!q){results.innerHTML="<div class='loading'>Film adı yaz.</div>";return;}

 results.innerHTML="<div class='loading'>Aranıyor...</div>";

 const s=await fetch(API+"?action=wbsearchentities&search="+encodeURIComponent(q)+"&language=tr&format=json&limit=20&origin=*");
 const data=await s.json();
 const all=data.search.map(x=>x.id);
 const ent=await getEntities(all);

 let html="";
 let count=0;

 for(const id of all){
   const e=ent[id];
   const c=e.claims||{};
   if(!ids(c,"P31").includes("Q11424")) continue;
   count++;
   html+=`
   <div class="card">
      <img class="poster" src="${fileUrl(poster(c))}">
      <div class="info">
        <h3>${label(e)}</h3>
        <p>${e.descriptions?.tr?.value||e.descriptions?.en?.value||""}</p>
        <div class="year">📅 ${year(c)}</div>
        <button class="btn" onclick="detail('${id}')">Film Detayı</button>
      </div>
   </div>`;
 }
 results.innerHTML=count?html:"<div class='loading'>Film bulunamadı.</div>";
}

async function detail(id){
 const box=document.getElementById("detail");
 box.style.display="block";
 box.innerHTML="<div class='loading'>Yükleniyor...</div>";
 box.scrollIntoView({behavior:"smooth"});

 const e=(await getEntities([id]))[id];
 const c=e.claims||{};
 const related=[...ids(c,"P57"),...ids(c,"P136"),...ids(c,"P161").slice(0,8)];
 const map=related.length?await getEntities([...new Set(related)]):{};

 const directors=ids(c,"P57").map(x=>label(map[x])).join(", ")||"Bilinmiyor";
 const genres=ids(c,"P136").map(x=>label(map[x]));
 const actors=ids(c,"P161").slice(0,8).map(x=>label(map[x]));

 box.innerHTML=`
 <div class="detail-flex">
   <img class="detail-poster" src="${fileUrl(poster(c))}">
   <div style="flex:1;min-width:260px">
      <h1 style="margin-bottom:10px">${label(e)}</h1>
      <div style="color:#ffd54f;margin-bottom:15px">📅 ${year(c)}</div>
      <p style="line-height:1.7;color:#ddd">${e.descriptions?.tr?.value||e.descriptions?.en?.value||""}</p>

      <div style="margin-top:18px">
        <strong>🎥 Yönetmen</strong><br>${directors}
      </div>

      <div style="margin-top:18px">
        <strong>🎭 Türler</strong><br>
        ${genres.map(g=>`<span class="badge">${g}</span>`).join("")}
      </div>

      <div style="margin-top:18px">
        <strong>👥 Oyuncular</strong><br>
        ${actors.join(", ")||"Bilinmiyor"}
      </div>

      <button class="btn close" onclick="document.getElementById('detail').style.display='none'">Kapat</button>
   </div>
 </div>`;
}

document.getElementById("q").addEventListener("keydown",e=>{
 if(e.key==="Enter") search();
});
</script>

</body>
</html>

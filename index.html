<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Portal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

header {
    background: #111118;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #e50914;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
}

.hero {
    text-align: center;
    padding: 70px 20px;
    background: linear-gradient(135deg, #17171f, #0b0b0f);
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    color: #aaa;
    margin-bottom: 30px;
}

.search-box {
    display: flex;
    max-width: 650px;
    margin: auto;
}

.search-box input {
    flex: 1;
    padding: 16px;
    font-size: 16px;
    border: none;
    outline: none;
    border-radius: 8px 0 0 8px;
}

.search-box button {
    padding: 16px 25px;
    border: none;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border-radius: 0 8px 8px 0;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: 50px auto;
}

h2 {
    margin-bottom: 25px;
}

#results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #15151d;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid #252530;
}

.card h3 {
    color: white;
    margin-bottom: 10px;
}

.card p {
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 10px;
}

.year {
    color: #e50914 !important;
    font-weight: bold;
}

.detail-button {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: none;
    background: #e50914;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.detail-button:hover {
    background: #b20710;
}

#detail {
    display: none;
    margin-top: 50px;
    padding: 30px;
    background: #15151d;
    border: 1px solid #333;
    border-radius: 12px;
}

#detail h2 {
    color: #e50914;
}

.detail-row {
    margin: 15px 0;
    line-height: 1.6;
}

.detail-label {
    color: #e50914;
    font-weight: bold;
}

.close-button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    background: #333;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.genres {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.genre {
    background: #15151d;
    padding: 20px;
    text-align: center;
    border-radius: 8px;
}

footer {
    margin-top: 70px;
    padding: 30px;
    text-align: center;
    background: #111118;
    color: #777;
}

.loading {
    color: #aaa;
    text-align: center;
    padding: 30px;
}

.error {
    color: #ff4d4d;
    text-align: center;
    padding: 30px;
}

@media(max-width:600px) {
    .hero h1 {
        font-size: 30px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box input {
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .search-box button {
        border-radius: 8px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎬 Film Portal</div>

    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#filmler">Filmler</a>
        <a href="#turler">Türler</a>
    </nav>
</header>

<section class="hero">
    <h1>Film dünyasını keşfet 🎬</h1>
    <p>Film ara, bilgilerini keşfet.</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Film adı yazın..."
        >

        <button onclick="searchMovies()">
            Ara 🔎
        </button>
    </div>
</section>

<div class="container" id="filmler">

    <h2>Film Sonuçları</h2>

    <div id="results">
        <p>Bir film arayın.</p>
    </div>

    <!-- FİLM DETAYI -->
    <div id="detail"></div>

</div>

<div class="container" id="turler">

    <h2>Film Türleri</h2>

    <div class="genres">
        <div class="genre">💥 Aksiyon</div>
        <div class="genre">👻 Korku</div>
        <div class="genre">😂 Komedi</div>
        <div class="genre">🚀 Bilim Kurgu</div>
        <div class="genre">🎭 Dram</div>
        <div class="genre">🔪 Gerilim</div>
        <div class="genre">🏔️ Macera</div>
        <div class="genre">🧙 Fantastik</div>
    </div>

</div>

<footer>
    © 2026 Film Portal
</footer>

<script>

const API = "https://www.wikidata.org/w/api.php";

/* HTML güvenliği */
function escapeHTML(text) {

    if (!text) return "";

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* Wikidata'dan film ara */
async function searchMovies() {

    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const detail = document.getElementById("detail");

    const query = input.value.trim();

    if (!query) {
        results.innerHTML = "<p>Önce bir film adı yazın.</p>";
        return;
    }

    detail.style.display = "none";
    detail.innerHTML = "";

    results.innerHTML =
        '<div class="loading">🔎 Filmler aranıyor...</div>';

    try {

        const url =
            API +
            "?action=wbsearchentities" +
            "&search=" + encodeURIComponent(query) +
            "&language=tr" +
            "&uselang=tr" +
            "&format=json" +
            "&limit=20" +
            "&origin=*";

        const response = await fetch(url);

        const data = await response.json();

        if (!data.search || data.search.length === 0) {

            results.innerHTML =
                '<div class="error">Film bulunamadı.</div>';

            return;
        }

        /* Sonuçların ID'lerini al */
        const ids = data.search.map(item => item.id);

        const entityUrl =
            API +
            "?action=wbgetentities" +
            "&ids=" + ids.join("|") +
            "&languages=tr|en" +
            "&props=claims|labels|descriptions" +
            "&format=json" +
            "&origin=*";

        const entityResponse = await fetch(entityUrl);

        const entityData = await entityResponse.json();

        let movies = [];

        for (const id of ids) {

            const entity = entityData.entities[id];

            if (!entity) continue;

            /* P31 = instance of */
            const claims = entity.claims || {};

            const instanceClaims = claims.P31 || [];

            let isFilm = false;

            for (const claim of instanceClaims) {

                if (
                    claim.mainsnak &&
                    claim.mainsnak.datavalue &&
                    claim.mainsnak.datavalue.value &&
                    claim.mainsnak.datavalue.value.id === "Q11424"
                ) {
                    isFilm = true;
                }
            }

            if (!isFilm) continue;

            movies.push({
                id: id,
                entity: entity
            });
        }

        if (movies.length === 0) {

            results.innerHTML =
                '<div class="error">Bu isimde uygun film bulunamadı.</div>';

            return;
        }

        results.innerHTML = "";

        movies.forEach(movie => {

            const entity = movie.entity;

            let title = query;

            if (
                entity.labels &&
                entity.labels.tr &&
                entity.labels.tr.value
            ) {
                title = entity.labels.tr.value;
            }
            else if (
                entity.labels &&
                entity.labels.en &&
                entity.labels.en.value
            ) {
                title = entity.labels.en.value;
            }

            let description = "Film bilgisi bulunamadı.";

            if (
                entity.descriptions &&
                entity.descriptions.tr
            ) {
                description =
                    entity.descriptions.tr.value;
            }
            else if (
                entity.descriptions &&
                entity.descriptions.en
            ) {
                description =
                    entity.descriptions.en.value;
            }

            let year = "";

            if (
                entity.claims &&
                entity.claims.P577 &&
                entity.claims.P577.length > 0
            ) {

                const time =
                    entity.claims.P577[0]
                        .mainsnak
                        .datavalue
                        .value
                        .time;

                if (time) {
                    year = time.substring(1, 5);
                }
            }

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>${escapeHTML(title)}</h3>

                <p>${escapeHTML(description)}</p>

                ${
                    year
                    ? `<p class="year">📅 ${escapeHTML(year)}</p>`
                    : ""
                }

                <button
                    class="detail-button"
                    onclick="showMovieDetail('${movie.id}')"
                >
                    Film Detaylarını Gör →
                </button>
            `;

            results.appendChild(card);

        });

    }
    catch (error) {

        console.error(error);

        results.innerHTML =
            '<div class="error">Bir hata oluştu. Tekrar deneyin.</div>';
    }
}


/* Film detaylarını aynı sayfada aç */
async function showMovieDetail(id) {

    const detail =
        document.getElementById("detail");

    detail.style.display = "block";

    detail.innerHTML =
        '<div class="loading">🎬 Film detayları yükleniyor...</div>';

    /* Detay bölümüne git */
    detail.scrollIntoView({
        behavior: "smooth"
    });

    try {

        const url =
            API +
            "?action=wbgetentities" +
            "&ids=" + id +
            "&languages=tr|en" +
            "&props=claims|labels|descriptions" +
            "&format=json" +
            "&origin=*";

        const response =
            await fetch(url);

        const data =
            await response.json();

        const movie =
            data.entities[id];

        if (!movie) {

            detail.innerHTML =
                '<div class="error">Film bilgisi bulunamadı.</div>';

            return;
        }

        /* Başlık */

        let title = "Bilinmeyen film";

        if (
            movie.labels &&
            movie.labels.tr
        ) {
            title =
                movie.labels.tr.value;
        }
        else if (
            movie.labels &&
            movie.labels.en
        ) {
            title =
                movie.labels.en.value;
        }


        /* Açıklama */

        let description =
            "Açıklama bulunamadı.";

        if (
            movie.descriptions &&
            movie.descriptions.tr
        ) {
            description =
                movie.descriptions.tr.value;
        }
        else if (
            movie.descriptions &&
            movie.descriptions.en
        ) {
            description =
                movie.descriptions.en.value;
        }


        /* Yıl */

        let year =
            "Bilinmiyor";

        if (
            movie.claims &&
            movie.claims.P577 &&
            movie.claims.P577.length > 0
        ) {

            const time =
                movie.claims.P577[0]
                    .mainsnak
                    .datavalue
                    .value
                    .time;

            if (time) {
                year =
                    time.substring(1, 5);
            }
        }


        /* Yönetmen ID */

        let directorIds = [];

        if (
            movie.claims &&
            movie.claims.P57
        ) {

            directorIds =
                movie.claims.P57
                    .map(c =>
                        c.mainsnak?.datavalue?.value?.id
                    )
                    .filter(Boolean);
        }


        /* Tür ID */

        let genreIds = [];

        if (
            movie.claims &&
            movie.claims.P136
        ) {

            genreIds =
                movie.claims.P136
                    .map(c =>
                        c.mainsnak?.datavalue?.value?.id
                    )
                    .filter(Boolean);
        }


        /* Oyuncu ID */

        let actorIds = [];

        if (
            movie.claims &&
            movie.claims.P161
        ) {

            actorIds =
                movie.claims.P161
                    .slice(0, 10)
                    .map(c =>
                        c.mainsnak?.datavalue?.value?.id
                    )
                    .filter(Boolean);
        }


        /* Tüm bağlı verileri tek seferde al */

        const relatedIds =
            [
                ...directorIds,
                ...genreIds,
                ...actorIds
            ];

        let relatedData = {};

        if (relatedIds.length > 0) {

            const relatedUrl =
                API +
                "?action=wbgetentities" +
                "&ids=" +
                [...new Set(relatedIds)].join("|") +
                "&languages=tr|en" +
                "&props=labels" +
                "&format=json" +
                "&origin=*";

            const relatedResponse =
                await fetch(relatedUrl);

            const relatedJson =
                await relatedResponse.json();

            relatedData =
                relatedJson.entities;
        }


        function getLabel(id) {

            const item =
                relatedData[id];

            if (!item) return id;

            if (
                item.labels &&
                item.labels.tr
            ) {
                return item.labels.tr.value;
            }

            if (
                item.labels &&
                item.labels.en
            ) {
                return item.labels.en.value;
            }

            return id;
        }


        const directors =
            directorIds
                .map(getLabel)
                .join(", ") ||
            "Bilinmiyor";


        const genres =
            genreIds
                .map(getLabel)
                .join(", ") ||
            "Bilinmiyor";


        const actors =
            actorIds
                .map(getLabel)
                .join(", ") ||
            "Bilinmiyor";


        /* DETAY KUTUSU */

        detail.innerHTML = `

            <h2>🎬 ${escapeHTML(title)}</h2>

            <div class="detail-row">
                <span class="detail-label">
                    Açıklama:
                </span>
                <br>
                ${escapeHTML(description)}
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    📅 Yapım Yılı:
                </span>
                ${escapeHTML(year)}
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    🎥 Yönetmen:
                </span>
                ${escapeHTML(directors)}
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    🎭 Tür:
                </span>
                ${escapeHTML(genres)}
            </div>

            <div class="detail-row">
                <span class="detail-label">
                    👥 Oyuncular:
                </span>
                ${escapeHTML(actors)}
            </div>

            <button
                class="close-button"
                onclick="closeDetail()"
            >
                Detayı Kapat
            </button>

        `;

    }
    catch (error) {

        console.error(error);

        detail.innerHTML =
            '<div class="error">Detaylar yüklenirken hata oluştu.</div>';
    }
}


/* Detayı kapat */

function closeDetail() {

    const detail =
        document.getElementById("detail");

    detail.style.display =
        "none";

    detail.innerHTML =
        "";
}


/* Enter ile arama */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                searchMovies();
            }

        }
    );

</script>

</body>
</html>
